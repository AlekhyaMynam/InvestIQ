[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "investiq"
version = "0.1.0"
description = "AI-powered institutional-style equity research platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "python-dateutil>=2.9,<3.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
    "google-cloud-bigquery>=3.0,<4.0",
    "pandas>=2.0,<3.0",
    "plotly>=5.18,<6.0",
    "jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/investiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
